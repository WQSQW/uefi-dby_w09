#
# Boot Shim Configs
#   DBY-W09：kernel 段是普通 arm64 Image（BootShim 头），需要 header
#
[boot_shim]
requires_kernel_header = true

#
# UEFI FD Configs
#   base 0xCE000000 来自真机验证过的 BootShim（offset 0x48）。
#   size 从 0x700000(7MiB) 改成 0x800000(8MiB)，原因是硬算出来的：
#     FVMAIN 是 NumBlocks=0 的"自动撑满"卷，2026-10-22 04:01 那版解包实测
#     103 个文件、7194080 / 7196672 B，只剩 2592 B（见 fv_list.py 输出）。
#     按键要再加 KeypadDeviceDxe + KeypadDxe 两个模块（几十 KB），7MiB 装不下，
#     GenFv 会直接报 FV full。加 1MiB 后 FVMAIN 有余量，后面修 USB 也能用。
#   0xCE000000 + 8MiB = 0xCE800000，仍在 MemoryMapLib 里 "UEFI FD" 那条
#   0xCE000000 / 0x02000000(32MiB) 的预留范围内，不会和 0xD0000000 起的
#   RAM Partition 撞车；install_dby_w09.sh 的自检也会再核一遍。
#   boot.img 里 kernel 段原始 22,254,616 B，我们只用了 1,170,633 B，
#   余量 21MB —— FD 变大后 payload 也就多 100~200KB，放得下。
#
[uefi_fd]
base = 0xCE000000
size = 0x800000

#
# Android Boot Image Kernel Configs
#   第一版不追加 DTB：DBY-W09 没有 kona-huawei 的设备树，
#   UEFI 自身不需要 DTB（SimpleFbDxe 靠内存描述表里的 Display Reserved）。
#   append_dtb 保持 false：DTB 走 boot header 的 --dtb，不拼在 kernel 段尾。
#   Resources/DTBs/dby_w09.dts 只提供 rootparam 节点，供 dtbo 分区那份 overlay 定位。
#
[boot_image_kernel]
kernel_compression = "none"
append_dtb         = false

#
# Android Boot Image Configs
#
# 真机（ABL unlocked, boot state orange）验证过的布局：header v2，kernel 段是原始
# BootShim.bin + SILICIUM_UEFI.fd。header 里的 DTB 必须带 rootparam 节点且用 dtc -@
# 编过，dtbo 分区那份 536B overlay 的 __fixups__ 就是指向 rootparam；缺了它 ABL 报
# "ApplyOverlay: ufdt apply overlay failed" 然后退出 fastboot。
[boot_image]
header_version = 2
pagesize       = 4096
base           = 0
kernel_offset  = 0x8000
tags_offset    = 0x1e00000
dtb            = "Resources/DTBs/dby_w09.dtb"
dtb_offset     = 0x1f00000
